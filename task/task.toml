artifacts = ["/app/output/violations.csv"]

[task]
name = "dynamo/retention-audit"
description = "Compute overdue records for deletion from a retention policy and legal-hold dataset."

[metadata]
category = "regulated_knowledge_work_and_business_operations"
subcategory = "legal_and_compliance"
task_objective = ["analyze", "generate"]
artifact_type = ["dataset_or_tabular_file", "generated_output_artifact"]
expert_time_estimate_hours = 2
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "The task requires reading CSV inputs, applying a legal retention policy with category/region rules, legal-hold exemptions, and consent-withdrawal overrides, and producing an exact deletion-violation report. The core challenge is the rule precedence and date arithmetic rather than the syntax of the code."
solution_explanation = "Load the policy and CSV inputs, parse the audit date and dates from the data files, apply the retention table and the legal-hold and consent-withdrawal exclusion rules, and write /app/output/violations.csv with the overdue records sorted by record_id."
verification_explanation = "The verifier checks that /app/output/violations.csv exists, has the expected columns, contains the exact policy-compliant rows from the hidden oracle, and that the policy file is visible to the agent."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false
mcp_servers = []
