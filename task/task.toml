artifacts = ["/app/output/violations.csv"]

[task]
name = "dynamo/privacy-retention-audit"
description = "Analyze a synthetic compliance dataset and write an exact deletion-violation report from policy, legal-hold, and consent-withdrawal rules."

[metadata]
category = "regulated_knowledge_work_and_business_operations"
subcategory = "legal_and_compliance"
task_objective = ["analyze", "generate"]
artifact_type = ["dataset_or_tabular_file", "generated_output_artifact"]
expert_time_estimate_hours = 2
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "The task requires reading multiple CSV files, applying a legal retention policy with category/region rules, legal-hold overrides, and consent-withdrawal acceleration, and producing an exact deletion-violation report. The core challenge is the precedence hierarchy and date arithmetic rather than the syntax of the code."
solution_explanation = "Load the policy and CSV inputs, parse the audit date and dates from the data files, apply the precedence hierarchy of hold versus statutory minimum versus consent withdrawal versus default retention, and write /app/output/violations.csv with the overdue records sorted by record_id."
verification_explanation = "The verifier checks that /app/output/violations.csv exists, has the expected columns, and matches the exact oracle rows for the hidden reference solution."

