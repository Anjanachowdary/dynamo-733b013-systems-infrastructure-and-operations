artifacts = ["/app/report.json"]

[task]
name = "dynamo/log-report"
description = "Parse an Apache-style access log into a small JSON summary report."

[metadata]
category = "data_processing_and_etl"
subcategory = "text_processing"
task_objective = ["transform", "generate"]
artifact_type = ["text_or_log_file", "generated_output_artifact"]
expert_time_estimate_hours = 0.3
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "Requires reading an Apache-style access log line by line, extracting the client IP and request path from each line with basic string and regex parsing, and aggregating three simple statistics (a count, a distinct-value count, and a mode). No external libraries or tricky edge cases are involved, so this is a low-difficulty scripting task."
solution_explanation = "Read /app/access.log line by line, split each line to get the client IP, extract the request path with a regex on the quoted request portion, tally total lines, unique IPs (a set), and per-path counts (a Counter). Write total_requests, unique_ips, and top_path (the most common path) to /app/report.json."
verification_explanation = "The verifier recomputes total_requests, unique_ips, and top_path directly from /app/access.log and asserts that /app/report.json exists, is valid JSON, and that each of its three fields exactly matches the independently recomputed value."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false
mcp_servers = []
